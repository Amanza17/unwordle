<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>unwordle</title>
<style>
:root{--bg:#121213;--line:#3a3a3c;--text:#f8f8f8;--muted:#818384;--green:#538d4e;--yellow:#b59f3b;--gray:#3a3a3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:min(100%,510px);padding:12px 16px 30px}.top{height:55px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}.top h1{font-size:28px;letter-spacing:3px;margin:0;font-weight:800}.badge{position:absolute;right:0;color:#d7d7d7;font-size:10px;border:1px solid var(--line);border-radius:12px;padding:5px 8px}
.info{text-align:center;color:#bbb;font-size:13px;line-height:1.5;margin:12px 0 14px;min-height:38px}.board{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width: min(330px,90vw);margin:0 auto 18px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tile{aspect-ratio:1;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;text-transform:uppercase;transition:transform .12s}.tile.filled{border-color:#565758}.tile.flip{animation:flip .45s ease forwards}.tile[data-state="2"]{background:var(--green);border-color:var(--green)}.tile[data-state="1"]{background:var(--yellow);border-color:var(--yellow)}.tile[data-state="0"]{background:var(--gray);border-color:var(--gray)}
@keyframes flip{50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}.keyboard{display:flex;flex-direction:column;gap:7px;max-width:470px;margin:auto}.keyrow{display:flex;justify-content:center;gap:5px}.key{height:52px;min-width:30px;padding:0 7px;border:0;border-radius:4px;background:#818384;color:white;font-weight:bold;font-size:14px;cursor:pointer}.key.wide{min-width:57px;font-size:11px}.key[data-state="2"]{background:var(--green)}.key[data-state="1"]{background:var(--yellow)}.key[data-state="0"]{background:var(--gray)}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:15px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.card{background:#202122;border:1px solid #555;border-radius:10px;padding:22px;max-width:360px;text-align:center}.card h2{margin:0 0 10px}.card p{color:#ddd;line-height:1.5}.card button{background:var(--green);color:white;border:0;border-radius:5px;padding:10px 16px;font-weight:bold;cursor:pointer}
@media(max-width:400px){.key{height:48px;min-width:26px;padding:0 5px}.key.wide{min-width:46px}.tile{font-size:27px}}
</style></head>
<body><main><header class="top"><h1>unwordle</h1></header>
<div class="info" id="info">Adivina la palabra de 5 letras en 6 intentos.<br>Las pistas siguen las reglas normales de Wordle.</div>
<div class="board" id="board" aria-label="Tablero de juego"></div><div class="keyboard" id="keyboard"></div>
<div class="foot">Enter: comprobar · ⌫: borrar · Puedes usar el teclado físico</div></main>
<div class="modal" id="modal"><div class="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button onclick="newGame()">Jugar otra vez</button></div></div>
<script>
// Palabras posibles: añadir palabras españolas de cinco letras, sin tildes, aquí.
const WORDS=`abeja abrir abuelo acera acero actriz activo actual acuse adios adulto aguas agudo ahora aisla ajeno aldea alerta algo altar amigo animo andar angel animal ancla antes arbol arena aroma asado asia avion ayuda baile bajar barco barrio basta beber bella bello besar bestia bicho bolsa bonito borde borrar brazo breve brillo brisa brote bueno burla buscar caber cable cabeza cacao caida calma calor cambio camino campo canal cantar capaz carga carne carta casa casco casar causa cebra cerca cerrar chico china chiste cinco cinta claro clase clave clima coche comer comic compra correr corta corto cosa crear creer cruzar cuero cuenta cuerpo cuesta cuidar culpa curso curva danza decir deuda diana dieta diner doble donde dormir dulce durar echar edad editar efecto elegir emitir enorme entrar envio epoca error estar etapa exacto extra facil falta falso fama feliz fecha feria feroz fibra fiesta final firme flaco flores flota fondo forma frase fruta fuego fuerte ganar gente gesto giro golpe gordo gracia grado gramo grande grasa grupo guapo guerra guia gusto hablar hacer hallar hasta hecho herir hierro hielo hijos hogar hombre honra hotel huevo igual imagen indio jamas joven juego junio justo kilo lado largo leche leer lejos lenta lento letra libro libre limpiar linea lindo lista llevar lluvia llave lograr lucha madre magia malo manga manos manta marzo media mejor menos mente mesa metal metro miedo mitad modelo moneda monte moral motor mucho mujer mundo museo musica nacer nadie nariz natal negro nervio nieve nivel noble noche novio nueve nuevo nube nunca obrar oeste oferta ojo olivo once opera optar orden oreja origen padre pagar papel parar pared parte pasar paseo pasta patio pausa pecho pegar pensar peor perder perro pesca pesar piano piedra pieza pintar pista placa plano playa plaza plena pleno poder poeta poner propio prueba pueblo puente puerta pulso punto queda querer queso quitar radio rapido razon regla reina reino reloj resto retar retiro ritmo rojo romper ronda ropa rostro rubio rueda saber sacar salir salsa salud sangre santo seco seguir semana sello selva senda serie serio servir sexto signo silla sitio sobre social sonar sonido suerte tabla tarde tarea teatro tecla temor tener tenso tierra tigre tinta tipo tomar tono tocar torre total traer trato triste trozo tunel unico unidad usar vacio valer valor vamos vapor variar vecino veinte vender venir verde verdad verano verso vestir viajar vidrio viejo viento virtud visita vivir vuelo volver yegua yerno zanja zarpa zona zorro zurdo`.toUpperCase().split(/\s+/).filter(w=>w.length===5);
const $=id=>document.getElementById(id);let candidates, row=0, col=0, finished=false, guesses=[], states=[];
const board=$('board'),keyboard=$('keyboard');
function build(){board.innerHTML='';for(let r=0;r<6;r++){let el=document.createElement('div');el.className='row';for(let c=0;c<5;c++){let t=document.createElement('div');t.className='tile';t.id=`t-${r}-${c}`;el.appendChild(t)}board.appendChild(el)}
const rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];rows.forEach((letters,i)=>{let line=document.createElement('div');line.className='keyrow';if(i===2)line.append(key('ENTER','wide',submit));for(const ch of letters)line.append(key(ch,'',()=>type(ch)));if(i===2)line.append(key('⌫','wide',erase));keyboard.append(line)})}
function key(label,cls,fn){let b=document.createElement('button');b.className='key '+cls;b.textContent=label;b.onclick=fn;if(label.length===1)b.id='k-'+label;return b}
function score(guess,answer){let out=Array(5).fill(0),remaining={};for(let i=0;i<5;i++)if(guess[i]===answer[i])out[i]=2;else remaining[answer[i]]=(remaining[answer[i]]||0)+1;for(let i=0;i<5;i++)if(out[i]===0&&remaining[guess[i]]){out[i]=1;remaining[guess[i]]--}return out.join('')}
// Elige la respuesta compatible que maximiza el grupo de soluciones restante.
function adversarialGuess(list){if(list.length===1)return list[0];let best=list[0],bestWorst=Infinity;for(const g of list){let buckets={};for(const a of list){let s=score(g,a);buckets[s]=(buckets[s]||0)+1}let worst=Math.max(...Object.values(buckets));if(worst<bestWorst){bestWorst=worst;best=g}}return best}
function type(ch){if(finished||col>=5)return;let t=$(`t-${row}-${col}`);t.textContent=ch;t.classList.add('filled');col++}
function erase(){if(finished||!col)return;col--;let t=$(`t-${row}-${col}`);t.textContent='';t.classList.remove('filled')}
function submit(){if(finished)return;if(col<5){message('Necesitas escribir cinco letras.');return}let guess='';for(let c=0;c<5;c++)guess+=$(`t-${row}-${c}`).textContent;let answer=adversarialGuess(candidates);let pattern=score(guess,answer);candidates=candidates.filter(w=>score(guess,w)===pattern);guesses.push(guess);states.push(pattern);for(let c=0;c<5;c++){let t=$(`t-${row}-${c}`);t.dataset.state=pattern[c];t.classList.add('flip');let k=$('k-'+guess[c]),old=k?.dataset.state;if(k&&(old===undefined||Number(pattern[c])>Number(old)))k.dataset.state=pattern[c]}
if(pattern==='22222'){finished=true;setTimeout(()=>end(true),650);return}row++;col=0;if(row===6){finished=true;setTimeout(()=>end(false),500);return}message('');}
function message(text){$('info').innerHTML=text||'Adivina la palabra de 5 letras en 6 intentos.<br>Las pistas siguen las reglas normales de Wordle.'}
function end(win){$('resultTitle').textContent=win?'¡Lo has conseguido!':'Partida terminada';$('resultText').textContent=win?'¡Has encontrado la palabra!':`La palabra era ${adversarialGuess(candidates)}.`;$('modal').classList.add('show')}
function newGame(){candidates=[...new Set(WORDS)];row=0;col=0;finished=false;guesses=[];states=[];$('modal').classList.remove('show');message('');build()}
document.addEventListener('keydown',e=>{if(e.key==='Enter')submit();else if(e.key==='Backspace')erase();else if(/^[a-zA-Z]$/.test(e.key))type(e.key.toUpperCase())});build();newGame();
</script></body></html>
